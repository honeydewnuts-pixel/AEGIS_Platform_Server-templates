name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'requirements*.txt'
  workflow_dispatch:   # adds a manual "Run workflow" button in the Actions tab - re-run anytime without a new commit
  schedule:
    # Weekly, independent of any code changes - new CVEs get published
    # against already-pinned dependency versions all the time.
    - cron: '0 6 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegis_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check backend/app --select E9,F63,F7,F82 --exit-zero
          # E9/F63/F7/F82 = syntax errors, undefined names, etc. Kept
          # non-blocking (--exit-zero) until the codebase has a full lint
          # pass - tighten this once that's done.

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --desc
          # Not --exit-zero: a known-vulnerable pinned dependency should
          # fail the build. If this ever blocks a release you need to ship
          # urgently, that's exactly the situation it's designed to force
          # a conscious decision about, not silently skip.

      - name: Run tests
        env:
          AEGIS_MASTER_KEY: dGVzdF9rZXlfMzJfYnl0ZXNfZXhhY3RseV8h  # test-only, not a real secret
          ADMIN_BOOTSTRAP_KEY: test-admin-key
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aegis_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest -v

      - name: Alembic migration check
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aegis_test
        working-directory: backend
        run: alembic upgrade head

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push - just verify it builds)
        run: docker build -f docker/Dockerfile -t aegis-api:ci .
