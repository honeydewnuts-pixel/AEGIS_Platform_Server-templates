name: Mobile CI

on:
  push:
    paths:
      - 'mobile_app/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile_app/**'
  workflow_dispatch:   # adds a manual "Run workflow" button in the Actions tab - re-run anytime without a new commit

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Uses the project's own committed Gradle wrapper (gradlew +
      # gradle/wrapper/gradle-wrapper.jar) - this is the normal, standard
      # way to build an Android project, now that a real wrapper jar
      # exists (previously this workflow provisioned Gradle directly as a
      # workaround while the wrapper was incomplete - see git history).
      - name: Make gradlew executable
        run: chmod +x gradlew

      # Validates the wrapper jar's checksum against Gradle's official
      # published checksums before trusting it to run anything - catches
      # a tampered or corrupted wrapper jar before it executes.
      - uses: gradle/actions/wrapper-validation@v3

      - name: Lint
        run: ./gradlew lint

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: aegis-mobile-debug
          path: mobile_app/app/build/outputs/apk/debug/*.apk

      - name: Upload lint report (always, even on failure - useful for debugging)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-report
          path: mobile_app/app/build/reports/lint-results-debug.html
