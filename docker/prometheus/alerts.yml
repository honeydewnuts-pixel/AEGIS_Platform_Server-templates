groups:
  - name: aegis
    rules:
      - alert: AegisApiDown
        expr: up{job="aegis-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "AEGIS API is down"

      - alert: AegisHighErrorRate
        expr: |
          sum(rate(http_requests_total{job="aegis-api",status=~"5.."}[5m]))
            /
          clamp_min(sum(rate(http_requests_total{job="aegis-api"}[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AEGIS 5xx error rate > 5%"
